# This file is your CI/CD pipeline
name: CI Pipeline
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Step 1: get the code
     - uses:actions/checkout@v3

     # Step 2: install python
     - name: Set up Python
       uses:actions/setup-python@v3
       with:
          python-version: '3.8.8'

    # Step 3: install dependencies python and pytest
     - name: Install pytest
       run: pip install pytest

    # Step 4: run the tests
     - name: Run tests
       run: pytest test_app.py -v